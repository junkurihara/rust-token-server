[package]
name = "rust-token-server"
description = "Authentication server handling id token in the context of OIDC and anonymous token based on RSA blind signatures"
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libcommon = { path = "../common", package = "rust-token-server-common", default-features = false }

anyhow = "1.0.104"
axum = { version = "0.8.9" }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["std", "cargo", "wrap_help"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
async-trait = "0.1.92"
uuid = { version = "1.29.3", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }
rust-argon2 = "3.0.0"
url = "2.5.8"

[features]
default = ["blind-signatures"]
blind-signatures = ["libcommon/blind-signatures"]
