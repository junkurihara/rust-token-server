[package]
name = "rust-token-server-client"
description = "Client library for `rust-token-server`"
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libcommon = { path = "../common", package = "rust-token-server-common", default-features = false }

tracing = "0.1.44"
anyhow = "1.0.104"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
tokio = { version = "1.54.1", features = [
  "net",
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
async-trait = "0.1.92"
thiserror = "2.0.21"
rand = { version = "0.10.4", default-features = false, features = [
  "sys_rng",
], optional = true }
base64 = { version = "0.23.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, optional = true, features = [
  "native-tls",
] }


[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "hickory-dns",
  "native-tls",
] }

[features]
default = ["blind-signatures", "reqwest"]
blind-signatures = ["libcommon/blind-signatures", "rand", "base64"]
reqwest = ["dep:reqwest"]
