[package]
name = "rust-token-server-client"
description = "Client library for `rust-token-server`"
authors.workspace = true
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libcommon = { path = "../common", package = "rust-token-server-common", default-features = false }

tracing = "0.1.44"
anyhow = "1.0.100"
url = "2.5.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = "0.4.43"
tokio = { version = "1.49.0", features = [
  "net",
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
async-trait = "0.1.89"
thiserror = "2.0.18"
rand = { version = "0.8.5", default-features = false, features = [
  "getrandom",
], optional = true }
base64 = { version = "0.22.1", optional = true }
reqwest = { version = "0.13.1", default-features = false, optional = true, features = [
  "native-tls",
] }


[dev-dependencies]
reqwest = { version = "0.13.1", default-features = false, features = [
  "json",
  "hickory-dns",
  "native-tls",
] }

[features]
default = ["blind-signatures", "reqwest"]
blind-signatures = ["libcommon/blind-signatures", "rand", "base64"]
reqwest = ["dep:reqwest"]
